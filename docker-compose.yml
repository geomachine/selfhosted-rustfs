version: '3.8'

services:
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    restart: unless-stopped
    ports:
      - "${RUSTFS_PORT:-9000}:9000"           # RustFS HTTP API
      - "${RUSTFS_WEB_PORT:-9001}:9001"       # Web Console
    volumes:
      - ${DATA_DIR:-./data}:/data             # Persistent storage (buckets + files)
    environment:
      - RUSTFS_ROOT_USER=${RUSTFS_ROOT_USER:-rustfsadmin}
      - RUSTFS_ROOT_PASSWORD=${RUSTFS_ROOT_PASSWORD:-rustfsadmin}
    command: /data
