# Local Development Configuration (HTTP only, no SSL)

# Upstream for RustFS API
upstream rustfs_api {
    server rustfs:9000;
    keepalive 32;
}

# Upstream for RustFS Console
upstream rustfs_console {
    server rustfs:9001;
    keepalive 32;
}

# HTTP Server for API (localhost:8080)
server {
    listen 80;
    server_name localhost api.localhost;

    # Root - S3 API (direct access)
    location / {
        proxy_pass http://rustfs_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts for large uploads
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffering settings for large files
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "api healthy\n";
        add_header Content-Type text/plain;
    }
}

# HTTP Server for Console (localhost:8081)
server {
    listen 8081;
    server_name localhost console.localhost;

    # Web Console - proxy everything to RustFS console
    location / {
        proxy_pass http://rustfs_console;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "console healthy\n";
        add_header Content-Type text/plain;
    }
}
