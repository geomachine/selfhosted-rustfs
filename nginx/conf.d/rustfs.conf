# Upstream for RustFS API
upstream rustfs_api {
    server rustfs:9000;
    keepalive 32;
}

# Upstream for RustFS Console
upstream rustfs_console {
    server rustfs:9001;
    keepalive 32;
}

# ============================================
# API SUBDOMAIN (api-rustfs.yourdomain.com)
# ============================================

# HTTP - Redirect to HTTPS
server {
    listen 80;
    server_name api-rustfs.yourdomain.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS - API Server
server {
    listen 443 ssl http2;
    server_name api-rustfs.yourdomain.com;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/api-rustfs.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-rustfs.yourdomain.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Root - S3 API (direct access)
    location / {
        proxy_pass http://rustfs_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Timeouts for large uploads
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffering settings for large files
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "api healthy\n";
        add_header Content-Type text/plain;
    }
}

# ============================================
# CONSOLE SUBDOMAIN (rustfs.yourdomain.com)
# ============================================

# HTTP - Redirect to HTTPS
server {
    listen 80;
    server_name rustfs.yourdomain.com;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS - Console Server
server {
    listen 443 ssl http2;
    server_name rustfs.yourdomain.com;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/rustfs.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rustfs.yourdomain.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Web Console
    location / {
        proxy_pass http://rustfs_console/rustfs/console/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Optional: Add basic auth for console
        # auth_basic "RustFS Console";
        # auth_basic_user_file /etc/nginx/.htpasswd;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "console healthy\n";
        add_header Content-Type text/plain;
    }
}
